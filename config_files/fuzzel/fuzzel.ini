# Dark application launcher styled after the previous st + fzf launcher.
[main]
font=Liberation Mono:pixelsize=18
dpi-aware=no
icons-enabled=yes
match-mode=fzf
terminal=alacritty -e

# Approximate the old centered 800x600 st window.
anchor=center
width=70
lines=24
horizontal-pad=30
vertical-pad=30
inner-pad=10

[colors]
background=000000ff
text=e5e5e5ff
prompt=e5e5e5ff
placeholder=808080ff
input=e5e5e5ff
match=34e2e2ff
selection=555555ff
selection-text=ffffffff
selection-match=34e2e2ff
border=555555ff

[border]
width=6
radius=0
selection-radius=0
